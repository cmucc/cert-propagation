[project]
name = "cert_receive"
dependencies = [
    "pyOpenSSL",
]
authors = [
    {name = "Keith Allen Bare II"},
]
description = "script for TLS/SSL certificate installation"
readme = "README.md"
license = "GPL-3.0-or-later"
dynamic = ["version"]

[project.scripts]
cert_receive = "cert_receive:main"

[project.urls]
Homepage = "https://github.com/cmucc/cert-propagation"
Repository = "https://github.com/cmucc/cert-propagation.git"

[build-system]
requires = [
    "setuptools>=68.1",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cert_receive"]

[tool.setuptools_scm]
version_file = "cert_receive/_version.py"
version_file_template = """
# file generated by setuptools-scm
# don't change, don't track in version control
version = {version!r}
version_tuple = {version_tuple!r}
"""

[tool.tox]
requires = ["tox>=4.21.1"]
env_list = ["py-pylint-latest", "py313-pylint-debian13",
            "py314-latest", "py-latest", "py313-debian13",
            "py311-debian12", "py39-debian11", "virtualenv20_4_7",
            "py37-debian10", "py35-debian9", "py34-debian8"]

[tool.tox.env_run_base]
package = "wheel"
wheel_build_env = ".pkg"
pass_env = [
    # to support running under fakeroot
    "FAKEROOTKEY",
    "LD_LIBRARY_PATH",
    "LD_PRELOAD",
]
set_env = [
    # prevent pytest instances that are run in parallel from interfering with
    # each other
    {TMPDIR = "{env_tmp_dir}"},
]
commands = [
    ["pytest", "tests", {replace="posargs", extend=true}],
]

[tool.tox.base_pylint]
commands = [
    ["python", "-P", "-m", "pylint", "cert_receive"],
    ["/bin/sh", "-c", "python -P -m pylint --rcfile tests/pylintrc.toml tests/*.py"],
]

# NB: the OpenSSL version used is based on the OpenSSL major version the
# corresponding Python was compiled against, *NOT* the OpenSSL version in the
# simulated Debian release

[tool.tox.base_openssl1_1]
set_env = [
    {replace="ref", of=["tool", "tox", "env_run_base", "set_env"], extend=true},
    # adjust as needed for where you have OpenSSL 1.1.x installed on your system
    {CPPFLAGS="-I/opt/openssl-1.1.1w/include"},
    {LDFLAGS="-L/opt/openssl-1.1.1w/lib"},
    {OPENSSL="/opt/openssl-1.1.1w/bin/openssl"},
]

[tool.tox.base_openssl1_0]
set_env = [
    {replace="ref", of=["tool", "tox", "env_run_base", "set_env"], extend=true},
    # adjust as needed for where you have OpenSSL 1.0.x installed on your system
    {CPPFLAGS="-I/opt/openssl-1.0.2u/include"},
    {LDFLAGS="-L/opt/openssl-1.0.2u/lib"},
    {OPENSSL="/opt/openssl-1.0.2u/bin/openssl"},
]

[tool.tox.env.py314-latest]
description = """Python 3.14 and the latest version of the \
                 pyOpenSSL/cryptography packages"""
deps = [
    "pytest",
    "pyOpenSSL",
    "cryptography",
]

[tool.tox.env.py-latest]
description = """Python used to run tox and the latest version of the \
                 pyOpenSSL/cryptography packages"""
deps = [
    "pytest",
    "pyOpenSSL",
    "cryptography",
]

[tool.tox.env.system]
description = """Default system python and only packages from its system \
                 site-packages directories"""
base_python = ["/usr/bin/python3"]
system_site_packages = true
commands = [
    ["python", "-P", "-m", "pytest", "tests", {replace="posargs", extend=true}],
]
allowlist_externals = ["/bin/sh"]
install_command = [
    "/bin/sh", "-c", """\
    case "$*" in
    *" --no-deps "*)
        exec "$@";
        ;;
    *)
        exit 0;
        ;;
    esac""", "--",
    "python", "-I", "-m", "pip", "install", '\{opts\}', '\{packages\}',
]

[tool.tox.env.py313-debian13]
description = """Python and pyOpenSSL/cryptography package versions \
                 in Debian 13"""
deps = [
    "pytest",
    "pyOpenSSL==25.0.0",
    "cryptography==43.0.0",
]

[tool.tox.env.py311-debian12]
description = """Python and pyOpenSSL/cryptography package versions \
                 in Debian 12"""
deps = [
    "pytest",
    "pyOpenSSL==23.0.0",
    "cryptography==38.0.4",
]

[tool.tox.env.py39-debian11]
description = """Python and pyOpenSSL/cryptography package versions \
                 in Debian 11"""
deps = [
    "pytest",
    "pyOpenSSL==20.0.1",
    "cryptography==3.3.2",
]

# this is used as an external creator for the Python 3.4 through Python 3.7
# virtual environments
[tool.tox.env.virtualenv20_4_7]
base_python = ["/usr/local/bin/python3.11"]
package = "skip"
deps = ["virtualenv==20.4.7"]
commands = []

[tool.tox.env.py37-debian10]
description = """Python and pyOpenSSL/cryptography package versions \
                 in Debian 10"""
runner = "external-virtualenv"
create_with_ext_env = "virtualenv20_4_7"
deps = [
    "pytest",
    "importlib-metadata",
    "pyOpenSSL==19.0.0",
    "cryptography==2.6.1",
]
set_env = [
    {replace="ref", of=["tool", "tox", "base_openssl1_1", "set_env"], extend=true},
]
install_command = ["python", "-I", "-m", "pip", "install",
                   "--no-binary=pyOpenSSL", "--no-binary=cryptography",
                   '\{opts\}', '\{packages\}']

[tool.tox.env.py35-debian9]
description = """Python and pyOpenSSL/cryptography package versions \
                 in Debian 9"""
runner = "external-virtualenv"
create_with_ext_env = "virtualenv20_4_7"
deps = [
    "pytest",
    "importlib-metadata",
    "pyOpenSSL==16.2.0",
    "cryptography==1.7.1",
]
set_env = [
    {replace="ref", of=["tool", "tox", "base_openssl1_1", "set_env"], extend=true},
    {CFLAGS="-Wno-error=incompatible-pointer-types"},
]
allowlist_externals = ["/bin/sh"]
install_command = ["/bin/sh", "tox_helpers/patch_packages.sh",
                   "{env_dir}", "cryptography-1.7.1.diff", "--", '\{opts\}',
                   "--no-binary=cryptography", "--no-binary=pyOpenSSL", "--",
                   '\{packages\}']
# the latest pytest that works with Python 3.5 tries (and fails) to read
# configuration from pyproject.toml; to avoid the crash, we tell it to use
# /dev/null as its configuration file
commands = [
    ["pytest", "-c", "/dev/null", "tests", {replace="posargs", extend=true}],
]

[tool.tox.env.py34-debian8]
description = """Python and pyOpenSSL/cryptography package versions \
                 in Debian 8"""
runner = "external-virtualenv"
create_with_ext_env = "virtualenv20_4_7"
deps = [
    "pytest",
    "importlib-metadata",
    "pyOpenSSL==0.14",
    "cryptography==0.6.1",
]
set_env = [
    {replace="ref", of=["tool", "tox", "base_openssl1_0", "set_env"], extend=true},
]
allowlist_externals = ["/bin/sh"]
install_command = ["/bin/sh", "tox_helpers/patch_packages.sh",
                   "{env_dir}", "cryptography-0.6.1.diff", "--", '\{opts\}',
                   "--no-binary=cryptography", "--no-binary=pyOpenSSL", "--",
                   '\{packages\}']

[tool.tox.env.py-pylint-latest]
description = """Run pylint against cert_receive and its tests using \
                 the Python running tox and the latest version of the \
                 pylint/pyOpenSSL/cryptography packages"""
deps = [
    "pylint",
    {replace="ref", of=["tool", "tox", "env", "py-latest", "deps"], extend=true},
]
commands = {replace="ref", of=["tool", "tox", "base_pylint", "commands"]}
allowlist_externals = ["/bin/sh"]

[tool.tox.env.pylint-system]
description = """Run pylint against cert_receive and its tests using \
                 the default system python and only packages from its \
                 system site-packages directories"""
base_python = ["/usr/bin/python3"]
system_site_packages = true
commands = {replace="ref", of=["tool", "tox", "base_pylint", "commands"]}
allowlist_externals = ["/bin/sh"]
install_command = {replace="ref", of=["tool", "tox", "env", "system", "install_command"]}

[tool.tox.env.py313-pylint-debian13]
description = """Run pylint against cert_receive and its tests using \
                 the python and pylint/pyOpenSSL/cryptography package \
                 versions in Debian 13"""
deps = [
    "pylint==3.3.4",
    {replace="ref", of=["tool", "tox", "env", "py313-debian13", "deps"], extend=true},
]
commands = {replace="ref", of=["tool", "tox", "base_pylint", "commands"]}
allowlist_externals = ["/bin/sh"]
